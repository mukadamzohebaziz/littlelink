<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title -->
    <title>Make My Poster</title>
    <link rel="icon" type="image/png" href="images/avatar.png">

    <!-- Meta Description -->
    <meta name="description" content="Explore custom wedding invitations and design posters by Make My Poster.">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourwebsite.com">

    <!-- Author Information -->
    <meta name="author" content="Make My Poster">

    <!-- Browser UI Color -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Font Preloads -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!-- Avatar Image -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Make My Poster Logo" width="128" height="128" fetchpriority="high">

            <!-- Name or Title -->
            <h1>Make My Poster</h1>

            <!-- Short Description -->
            <p>Custom digital wedding invitations & posters.</p>

            <!-- Link Buttons -->
            <nav class="button-stack" aria-label="Links">

              <!-- Wedding Invitation Website -->
              <a class="button button-default" href="https://makemyposter-weddinginvitation.vercel.app/" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/generic-homepage.svg" alt="Wedding Icon">
                Wedding Invitation Website
              </a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/makemyposter_/" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">
                Instagram
              </a>

            </nav>
          </main>

          <!-- Footer -->
          <footer>
            <a href="privacy.html">Privacy Policy</a>
          </footer>

    </div>
  </div>

</body>

</html>
